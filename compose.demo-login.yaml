services:
  db:
    environment:
      MYSQL_DATABASE: rc_demo_community
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: demo-login
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://db:3306/rc_demo_community
      DEMO_MEMBER1_PASSWORD: ${DEMO_MEMBER1_PASSWORD:?Run scripts/demo-login-setup.sh}
      DEMO_MEMBER2_PASSWORD: ${DEMO_MEMBER2_PASSWORD:?Run scripts/demo-login-setup.sh}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Run scripts/demo-login-setup.sh}
      GEMINI_ENABLED: "false"
      GEMINI_API_KEY: ""
      BUILDING_REGISTER_API_KEY: ""

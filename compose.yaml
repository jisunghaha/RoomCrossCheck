services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: roomcrosscheck
      MYSQL_USER: room_app
      MYSQL_PASSWORD: ${ROOM_DB_PASSWORD:?Set ROOM_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ROOM_DB_ROOT_PASSWORD:?Set ROOM_DB_ROOT_PASSWORD in .env}
    volumes:
      - room_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    volumes:
      - room_uploads:/data/advertisements
    environment:
      AD_STORAGE_DIR: /data/advertisements
      DB_URL: jdbc:mysql://db:3306/roomcrosscheck
      DB_USER: room_app
      DB_PASSWORD: ${ROOM_DB_PASSWORD:?Set ROOM_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  room_mysql:
  room_uploads:

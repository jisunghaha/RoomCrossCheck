spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/roomcrosscheck}
    username: ${DB_USER:room_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
ads:
  storage-dir: ${AD_STORAGE_DIR:/tmp/roomcrosscheck-ads}
server:
  address: 0.0.0.0
